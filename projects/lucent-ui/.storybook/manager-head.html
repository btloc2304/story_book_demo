<style>
  .cf-logout-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 28px !important;
    height: 28px !important;
    min-width: 28px !important;
    min-height: 28px !important;
    border-radius: 4px !important;
    color: rgba(255, 255, 255, 0.6) !important;
    background: transparent !important;
    border: none !important;
    cursor: pointer !important;
    outline: none !important;
    text-decoration: none !important;
    transition: color 0.15s ease, background-color 0.15s ease !important;
    padding: 0 !important;
    margin-left: 4px !important;
    z-index: 100 !important;
  }
  .cf-logout-btn:hover {
    color: #f43f5e !important;
    background-color: rgba(244, 63, 94, 0.12) !important;
  }
  .cf-logout-btn:active {
    transform: scale(0.95) !important;
  }
  .cf-logout-btn svg {
    width: 15px !important;
    height: 15px !important;
    stroke: currentColor !important;
    stroke-width: 2 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none !important;
    pointer-events: none !important;
  }
</style>
<script>
  (function() {
    function injectLogoutButton() {
      if (document.getElementById('cf-logout-btn')) return;
      
      const header = document.querySelector('[data-testid="sidebar-header"]') || 
                     document.querySelector('.sidebar-header') ||
                     document.querySelector('header');
                     
      if (header) {
        const gearBtn = header.querySelector('button');
        if (gearBtn) {
          // Keep header on one line
          header.style.display = 'flex';
          header.style.alignItems = 'center';
          header.style.justifyContent = 'space-between';
          header.style.flexWrap = 'nowrap';

          const btn = document.createElement('button');
          btn.id = 'cf-logout-btn';
          btn.className = 'cf-logout-btn';
          btn.type = 'button';
          btn.title = 'Đăng xuất khỏi Cloudflare Access';
          btn.setAttribute('aria-label', 'Đăng xuất');
          btn.innerHTML = `
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          `;
          
          // Block all event bubbling to Storybook's React/Radix popover handlers
          ['click', 'mousedown', 'mouseup', 'pointerdown', 'pointerup', 'focus'].forEach(function(eventType) {
            btn.addEventListener(eventType, function(e) {
              e.stopPropagation();
              e.stopImmediatePropagation();
              if (eventType === 'click') {
                e.preventDefault();
                window.location.href = '/cdn-cgi/access/logout';
              }
            }, true); // Use capture phase to intercept before React
          });

          // Insert directly next to the gear button without mutating gearBtn's parent hierarchy
          gearBtn.insertAdjacentElement('afterend', btn);
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', injectLogoutButton);
    } else {
      injectLogoutButton();
    }
    setInterval(injectLogoutButton, 1000);
  })();
</script>
