<style>
  .cf-logout-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    color: rgba(255, 255, 255, 0.6);
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s ease, background-color 0.15s ease;
    margin-left: 4px;
    position: relative;
  }
  .cf-logout-btn:hover {
    color: #f43f5e;
    background-color: rgba(244, 63, 94, 0.12);
  }
  .cf-logout-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
</style>
<script>
  (function() {
    function injectLogoutButton() {
      if (document.getElementById('cf-logout-btn')) return;
      
      // Find the settings icon / header tools container in Storybook sidebar
      const header = document.querySelector('[data-testid="sidebar-header"]') || 
                     document.querySelector('.sidebar-header') ||
                     document.querySelector('header');
                     
      if (header) {
        // Find the right-side container (where the gear icon is)
        const gearBtn = header.querySelector('button') || header.querySelector('a') || header.lastElementChild;
        const targetContainer = gearBtn ? gearBtn.parentElement : header;
        
        const btn = document.createElement('a');
        btn.id = 'cf-logout-btn';
        btn.className = 'cf-logout-btn';
        btn.href = '/cdn-cgi/access/logout';
        btn.title = 'Đăng xuất khỏi Cloudflare Access';
        btn.setAttribute('aria-label', 'Đăng xuất');
        btn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        `;
        
        targetContainer.appendChild(btn);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', injectLogoutButton);
    } else {
      injectLogoutButton();
    }
    setInterval(injectLogoutButton, 1000);
  })();
</script>
