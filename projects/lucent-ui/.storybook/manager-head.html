<style>
  .cf-logout-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #be123c;
    background: #ffe4e6;
    border: 1px solid #fecdd3;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    margin-left: 8px;
    z-index: 1000;
  }
  .cf-logout-button:hover {
    background: #fecdd3;
    color: #9f1239;
    text-decoration: none;
  }
  .cf-logout-button:active {
    transform: scale(0.97);
  }
</style>
<script>
  (function() {
    function addLogoutButton() {
      if (document.getElementById('cf-logout-link')) return;
      
      // Look for the sidebar header or main toolbar
      const sidebarHeader = document.querySelector('[data-testid="sidebar-header"]') || 
                            document.querySelector('.sidebar-header') || 
                            document.querySelector('header');
      
      if (sidebarHeader) {
        const btn = document.createElement('a');
        btn.id = 'cf-logout-link';
        btn.className = 'cf-logout-button';
        btn.href = '/cdn-cgi/access/logout';
        btn.title = 'Đăng xuất khỏi Cloudflare Access';
        btn.innerHTML = '🚪 Đăng xuất';
        sidebarHeader.appendChild(btn);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addLogoutButton);
    } else {
      addLogoutButton();
    }
    setInterval(addLogoutButton, 1500);
  })();
</script>
